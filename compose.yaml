services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: parking
      POSTGRES_USER: parking
      POSTGRES_PASSWORD: parking
    ports:
      - "${POSTGRES_PORT:-54329}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parking -d parking"]
      interval: 2s
      timeout: 2s
      retries: 15
  api:
    build: .
    restart: on-failure:5
    environment:
      DATABASE_URL: postgresql://parking:parking@postgres:5432/parking
      JWT_SECRET: local-development-secret
      PORT: 3000
      SEED_FLOOR_PLAN: /app/examples/garage-layout.yml
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/garage/floor-plan"]
      interval: 3s
      timeout: 3s
      retries: 20
  web:
    build:
      context: ./web
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres-data:
